services:
  minio:
    image: minio/minio:latest
    container_name: deliberations-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: deliberations-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    container_name: deliberations-api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://admin:admin@mongodb:27017
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - mongodb
      - minio

  web:
    build: ./web
    container_name: deliberations-web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules 

volumes:
  minio_data:
  mongo_data:
